<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; worker-src 'self' app: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<title>Max Slicer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6 18l3-11h6l3 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12h5" stroke="currentColor" stroke-width="1.8"/></svg>
    <div><b>Max Slicer</b><small>for Anycubic Photon Mono M7 Max</small></div>
  </div>
  <div class="filebar" id="filebar"></div>
  <nav class="steps" id="steps" aria-label="Workflow"></nav>
  <div class="topright" id="topright"></div>
</header>
<main class="work">
  <aside class="panel" id="panel" aria-label="Tools"></aside>
  <section class="viewport" id="viewport">
    <div class="vtools" id="vtools"></div>
    <div class="toolhint" id="toolhint" hidden></div>
    <div class="clipbar" id="clipbar"></div>
    <div class="layerview" id="layerview" hidden></div>
    <div class="dropzone" id="dropzone" hidden>Drop STL, OBJ, 3MF or .pm7m</div>
  </section>
  <aside class="side" id="side" aria-label="Plate"></aside>
</main>
<footer class="status" id="status"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
